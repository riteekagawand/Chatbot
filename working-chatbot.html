<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Assistant Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            background: #f8f9fa;
        }
        
        .chatbot-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 400px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chatbot-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .chatbot-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chatbot-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            background: #f1f3f4;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #f1f3f4;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .chatbot-input-container {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }
        
        .chatbot-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .chatbot-input:focus {
            border-color: #667eea;
        }
        
        .chatbot-send {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .chatbot-send:hover {
            background: #5a6fd8;
        }
        
        .chatbot-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .welcome-message {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        
        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }
        
        .status-indicator.offline {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            <div class="status-indicator" id="statusIndicator"></div>
            <div class="chatbot-title">🌍 Travel Assistant</div>
            <div class="chatbot-subtitle">Ask me about tours, FAQs, or travel planning</div>
        </div>
        
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="welcome-message">
                Hi! I'm your AI travel assistant. I can help you with information about our tours, answer FAQs, and assist with travel planning. How can I help you today?
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="chatbot-input-container">
            <input 
                type="text" 
                class="chatbot-input" 
                id="chatbotInput" 
                placeholder="Ask me about tours, FAQs, or travel..."
                onkeypress="handleKeyPress(event)"
            >
            <button class="chatbot-send" id="chatbotSend" onclick="sendMessage()">→</button>
        </div>
    </div>
    
    <script>
        // Configuration - Update these with your actual values
        const CHATBOT_CONFIG = {
            // Try different API endpoints
            apiEndpoints: [
                'http://localhost:3001/api/chatbot',  // Simple chatbot API
                'http://localhost:3000/api/test-contentstack',  // Contentstack API
                'http://localhost:3000/api/chat'  // Original chatbot API
            ],
            currentEndpointIndex: 0
        };
        
        let isOnline = false;
        
        // Check API health
        async function checkApiHealth() {
            const statusIndicator = document.getElementById('statusIndicator');
            
            for (let i = 0; i < CHATBOT_CONFIG.apiEndpoints.length; i++) {
                try {
                    const endpoint = CHATBOT_CONFIG.apiEndpoints[i];
                    const healthUrl = endpoint.replace('/api/chatbot', '/api/chatbot/health').replace('/api/chat', '/api/health').replace('/api/test-contentstack', '/api/test-contentstack-simple');
                    
                    const response = await fetch(healthUrl, { method: 'GET' });
                    if (response.ok) {
                        CHATBOT_CONFIG.currentEndpointIndex = i;
                        isOnline = true;
                        statusIndicator.classList.remove('offline');
                        console.log(`Connected to API: ${endpoint}`);
                        return true;
                    }
                } catch (error) {
                    console.log(`API endpoint ${i} not available:`, error.message);
                }
            }
            
            isOnline = false;
            statusIndicator.classList.add('offline');
            console.log('No API endpoints available');
            return false;
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatbotInput');
            const sendButton = document.getElementById('chatbotSend');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Disable input while processing
            input.disabled = true;
            sendButton.disabled = true;
            
            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                const currentEndpoint = CHATBOT_CONFIG.apiEndpoints[CHATBOT_CONFIG.currentEndpointIndex];
                let response;
                
                if (currentEndpoint.includes('/api/chatbot')) {
                    // Use POST for chatbot API
                    response = await fetch(currentEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message })
                    });
                } else {
                    // Use GET for Contentstack API
                    response = await fetch(`${currentEndpoint}?q=${encodeURIComponent(message)}`, {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' }
                    });
                }
                
                const data = await response.json();
                
                // Hide typing indicator
                hideTypingIndicator();
                
                // Add assistant response
                if (data.content) {
                    addMessage(data.content, 'assistant');
                } else if (data.error) {
                    addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
                } else {
                    addMessage('Sorry, I didn\'t understand that. Can you please rephrase your question?', 'assistant');
                }
                
            } catch (error) {
                console.error('Chatbot error:', error);
                hideTypingIndicator();
                
                // Try to reconnect
                const reconnected = await checkApiHealth();
                if (reconnected) {
                    addMessage('Connection restored! Please try your question again.', 'assistant');
                } else {
                    addMessage('Sorry, I\'m having trouble connecting right now. Please try again later.', 'assistant');
                }
            } finally {
                // Re-enable input
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        }
        
        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chatbotMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function showTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'flex';
        }
        
        function hideTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'none';
        }
        
        // Initialize chatbot
        async function init() {
            await checkApiHealth();
            document.getElementById('chatbotInput').focus();
        }
        
        // Initialize when page loads
        init();
    </script>
</body>
</html>
